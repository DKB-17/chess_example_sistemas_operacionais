# Wizard Chess — todo o sistema em containers:
#
#   navegador ──HTTP/WS──> web (nginx :80) ──/api, /ws──> server (Node :3001) ──SQL──> db (PostgreSQL :5432)
#
# Subir:   docker compose up -d --build
# Acessar: http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wizardchess}
      POSTGRES_USER: ${POSTGRES_USER:-chess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-chess}:${POSTGRES_PASSWORD:-chess}@db:5432/${POSTGRES_DB:-wizardchess}
      # Prazo (ms) para um jogador desconectado voltar antes da partida ser encerrada
      DISCONNECT_GRACE_MS: ${DISCONNECT_GRACE_MS:-5000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
