server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/octet-stream image/svg+xml;

    # API HTTP (criar sala, health) -> container "server"
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket (chat + jogadas em tempo real) -> container "server"
    # Os cabeçalhos Upgrade/Connection fazem o nginx "promover" a conexão HTTP para WebSocket.
    location /ws {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Ícones das peças: sempre revalida, para a troca de arquivo aparecer na hora
    location /assets/piece-icons/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html sempre revalida: depois de um novo build o navegador pega a versão
    # nova (os .js/.css têm hash no nome, então mudam de URL a cada build)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Front-end (SPA). URLs de sala como /x9t2g também caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
